<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NetPulse</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-adapter-date-fns/3.0.0/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>NetPulse</h1>
    <span id="conn-indicator" class="badge badge-unknown">connecting…</span>
  </header>

  <main class="grid">
    <section class="card card-wide">
      <div class="card-header">
        <h2>Live process activity</h2>
        <span class="hint">open connections per process, right now</span>
      </div>
      <canvas id="liveChart" height="90"></canvas>
      <table id="liveTable" class="table">
        <thead>
          <tr><th>Process</th><th>PID</th><th>Connections</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>Connectivity</h2>
      </div>
      <div id="connectivityStatus" class="status-list"></div>
    </section>

    <section class="card card-wide">
      <div class="card-header">
        <h2>Traffic history</h2>
        <div class="range-toggle" data-target="traffic">
          <button data-range="day" class="active">Day</button>
          <button data-range="week">Week</button>
        </div>
      </div>
      <canvas id="trafficHistoryChart" height="80"></canvas>
    </section>

    <section class="card card-wide">
      <div class="card-header">
        <h2>Connectivity history (latency)</h2>
        <div class="range-toggle" data-target="connectivity">
          <button data-range="day" class="active">Day</button>
          <button data-range="week">Week</button>
        </div>
      </div>
      <canvas id="connectivityHistoryChart" height="80"></canvas>
    </section>

    <section class="card card-wide">
      <div class="card-header">
        <h2>Recent alerts</h2>
      </div>
      <ul id="alertsList" class="alerts-list">
        <li class="empty">No alerts yet.</li>
      </ul>
    </section>
  </main>

  <script src="/js/websocket-client.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>netTAPESH</title>
  <link rel="stylesheet" href="/css/style.css" />
  <!-- Vendored locally (not loaded from a CDN) so the page works fully
       offline / behind restrictive firewalls, with no external
       dependency at runtime. -->
  <script src="/js/vendor/chart.umd.js"></script>
  <script src="/js/vendor/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>netTAPESH</h1>
    <span id="nowStamp" class="now-stamp"></span>
  </header>

  <nav class="tab-nav" id="tabNav">
    <button class="tab-nav-btn active" data-tab="speedtest">تست سرعت</button>
    <button class="tab-nav-btn" data-tab="continuousPing">تست پشت سر هم</button>
  </nav>

  <main class="page">
    <section class="page-tab" id="tab-speedtest">
    <section class="test-panel">
      <div class="stat-row">
        <div class="stat-block">
          <div class="stat-block-head">
            <svg class="icon icon-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v14M6 12l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>دانلود <span id="rDownUnit">Mbps</span></span>
          </div>
          <span id="rDown" class="stat-block-value">—</span>
        </div>
        <div class="stat-block">
          <div class="stat-block-head">
            <svg class="icon icon-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V6M6 12l6-6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>آپلود <span id="rUpUnit">Mbps</span></span>
          </div>
          <span id="rUp" class="stat-block-value">—</span>
        </div>
      </div>

      <div class="mini-stat-row">
        <div class="mini-stat">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="mini-stat-label">پینگ</span>
          <span id="rPing" class="mini-stat-value">—</span>
          <span class="mini-stat-unit">ms</span>
        </div>
        <div class="mini-stat">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-8 4 16 3-8h4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="mini-stat-label">جیتر</span>
          <span id="rJitter" class="mini-stat-value">—</span>
          <span class="mini-stat-unit">ms</span>
        </div>
      </div>

      <div class="gauge-row">
        <div class="side-info" id="ispInfo">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 21v-4h6v4M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1" stroke-linecap="round"/></svg>
          <span id="ispName" class="side-info-text">—</span>
        </div>

        <div class="gauge-wrap">
          <div id="gaugeRing" class="gauge-ring"></div>
          <button id="runBtn" class="run-circle">
            <span id="gaugeLiveValue" class="gauge-live-value"></span>
            <span id="runBtnLabel">شروع تست</span>
          </button>
        </div>

        <div class="side-info" id="locationInfo">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
          <span id="locationName" class="side-info-text">—</span>
        </div>
      </div>

      <div id="testPhase" class="test-phase"></div>

      <div class="unit-toggle" id="unitToggle">
        <button data-unit="mbps" class="active">Mbps</button>
        <button data-unit="MBps">MB/s</button>
      </div>
      <div id="resultMeta" class="hint"></div>
    </section>

    <section class="card card-wide">
      <div class="card-header">
        <h2>تاریخچه</h2>
        <div class="range-toggle" data-target="history">
          <button data-range="day" class="active">روز</button>
          <button data-range="week">هفته</button>
        </div>
      </div>
      <div class="history-chart-block">
        <h3 class="history-chart-title icon-down">دانلود (Mbps)</h3>
        <canvas id="historyChartDown" height="80"></canvas>
      </div>
      <div class="history-chart-block">
        <h3 class="history-chart-title icon-up">آپلود (Mbps)</h3>
        <canvas id="historyChartUp" height="80"></canvas>
      </div>
    </section>
    </section>

    <!-- ---- Continuous ping tab: repeats /api/speedtest/ping in a loop
         (like `ping -t`) until stopped, logging each round trip in a
         terminal-style scrolling log. This endpoint does nothing but
         reply instantly, so hammering it in a loop is negligible load
         — nowhere near the download/upload tests. ---- -->
    <section class="page-tab" id="tab-continuousPing" hidden>
      <section class="card card-wide">
        <div class="card-header">
          <h2>تست پشت سر هم</h2>
          <button id="pingLoopToggleBtn" class="ping-loop-btn">شروع</button>
        </div>
        <div id="pingLog" class="ping-log"></div>
        <div id="pingStats" class="ping-stats"></div>
      </section>
    </section>
  </main>

  <!-- ---- Results overlay: shown after a test finishes, styled after a
       real Speedtest.net results screen the user pointed at. Hidden by
       default (see [hidden] in style.css); JS fills every value in and
       un-hides it once a test completes. ---- -->
  <div id="resultsOverlay" class="results-overlay" hidden>
    <div class="results-panel">
      <button id="resultsCloseBtn" class="results-close" aria-label="بستن">✕</button>

      <div class="results-stat-row">
        <div class="results-stat">
          <div class="results-stat-head icon-down">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v14M6 12l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>دانلود Mbps</span>
          </div>
          <span id="resDown" class="results-stat-value">—</span>
        </div>
        <div class="results-stat">
          <div class="results-stat-head icon-up">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V6M6 12l6-6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>آپلود Mbps</span>
          </div>
          <span id="resUp" class="results-stat-value">—</span>
        </div>
      </div>

      <div class="results-mini-row">
        <div class="results-mini">
          <span class="results-mini-label">پینگ ms</span>
          <span id="resPing" class="results-mini-value">—</span>
        </div>
        <div class="results-mini">
          <span class="results-mini-label">جیتر ms</span>
          <span id="resJitter" class="results-mini-value">—</span>
        </div>
      </div>

      <div class="results-quality-row" id="resultsQualityRow">
        <!-- filled by JS: gaming / streaming / video-call / web-browsing, each with a 5-dot rating -->
      </div>

      <div class="results-meta-list">
        <div class="results-meta-row">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>اتصال</span>
          <span class="results-meta-value">چندگانه (۴ کانکشن موازی)</span>
        </div>
        <div class="results-meta-row">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 21v-4h6v4M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1" stroke-linecap="round"/></svg>
          <span>ارائه‌دهنده</span>
          <span id="resIsp" class="results-meta-value">—</span>
        </div>
        <div class="results-meta-row">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5" stroke-linecap="round"/></svg>
          <span>آی‌پی شما</span>
          <span id="resIp" class="results-meta-value">—</span>
        </div>
        <div class="results-meta-row">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
          <span>لوکیشن</span>
          <span id="resLocation" class="results-meta-value">—</span>
        </div>
      </div>

      <div id="resultsTimestamp" class="hint"></div>
    </div>
  </div>

  <script src="/js/speedtest.js"></script>
</body>
</html>

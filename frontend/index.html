<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>netTAPESH</title>
  <link rel="stylesheet" href="/css/style.css" />
  <!-- Vendored locally (not loaded from a CDN) so the page works fully
       offline / behind restrictive firewalls, with no external
       dependency at runtime. -->
  <script src="/js/vendor/chart.umd.js"></script>
  <script src="/js/vendor/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>netTAPESH <span class="subtitle">تست سرعت اینترنت</span></h1>
  </header>

  <main class="page">
    <section class="test-panel">
      <button id="runBtn" class="run-circle">
        <span id="runBtnLabel">شروع تست</span>
      </button>
      <div id="testPhase" class="test-phase"></div>

      <div class="result-grid">
        <div class="result-tile">
          <span class="result-label">پینگ</span>
          <span id="rPing" class="result-value">—</span>
          <span class="result-unit">ms</span>
        </div>
        <div class="result-tile">
          <span class="result-label">دانلود</span>
          <span id="rDown" class="result-value">—</span>
          <span class="result-unit">Mbps</span>
        </div>
        <div class="result-tile">
          <span class="result-label">آپلود</span>
          <span id="rUp" class="result-value">—</span>
          <span class="result-unit">Mbps</span>
        </div>
      </div>
      <div id="resultMeta" class="hint"></div>
    </section>

    <section class="card card-wide">
      <div class="card-header">
        <h2>تاریخچه</h2>
        <div class="range-toggle" data-target="history">
          <button data-range="day" class="active">روز</button>
          <button data-range="week">هفته</button>
        </div>
      </div>
      <canvas id="historyChart" height="80"></canvas>
    </section>
  </main>

  <script src="/js/speedtest.js"></script>
</body>
</html>

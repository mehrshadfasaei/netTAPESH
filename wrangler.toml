# Cloudflare Worker config (the current unified Workers+static-assets
# model, not the older separate "Pages" product) — serves frontend/ as
# static files and worker/index.js as the API. Requests matching a file
# under frontend/ are served directly without touching the Worker
# script at all; everything else (our /api/* routes, /health) reaches
# worker/index.js. See worker/README.md for the full deployment
# walkthrough (D1 database creation, applying schema.sql, filling in
# database_id below).
name = "nettapesh"
main = "worker/index.js"
# Cloudflare's own dashboard defaulted to today's date when a binding
# was added there directly — matching it rather than an older pinned
# date, since static-assets-serving Workers are a newer feature and an
# older compatibility_date may not fully support it.
compatibility_date = "2026-09-05"
# Gives an immediately-testable https://nettapesh.<subdomain>.workers.dev
# URL before a custom domain is wired up (see README's Cloudflare
# section) — turn off once nettapesh.ir is pointed here, if you'd
# rather only the real domain served it.
workers_dev = true
# Explicit per a build-log warning: leaving this unset made Cloudflare
# silently default it to true, which may have been involved in every
# request to the base workers.dev URL throwing (Error 1101) despite a
# clean deploy and zero Observability events — worth ruling out.
preview_urls = false

[assets]
directory = "./frontend"

[[d1_databases]]
binding = "DB"
database_name = "nettapesh"
database_id = "06d04b54-6f16-4819-9005-e60f6f1bfde6"

# One binding per endpoint (the native Rate Limiting API fixes a single
# limit/period per binding, not per call) — same per-route limits as
# backend/api/routes.py's @limiter.limit(...) decorators, sized to
# clear a normal test's request burst while still capping abuse. period
# is in seconds; the API only allows 10 or 60.
[[ratelimits]]
name = "RL_PING"
namespace_id = "1001"
[ratelimits.simple]
limit = 180
period = 60

[[ratelimits]]
name = "RL_CLIENT_INFO"
namespace_id = "1002"
[ratelimits.simple]
limit = 20
period = 60

[[ratelimits]]
name = "RL_DOWNLOAD"
namespace_id = "1003"
[ratelimits.simple]
limit = 60
period = 60

[[ratelimits]]
name = "RL_UPLOAD"
namespace_id = "1004"
[ratelimits.simple]
limit = 180
period = 60

[[ratelimits]]
name = "RL_RESULT"
namespace_id = "1005"
[ratelimits.simple]
limit = 20
period = 60

[[ratelimits]]
name = "RL_LATEST"
namespace_id = "1006"
[ratelimits.simple]
limit = 60
period = 60

[[ratelimits]]
name = "RL_HISTORY"
namespace_id = "1007"
[ratelimits.simple]
limit = 60
period = 60

# Staging — a second, independent Worker (own name, so its own
# workers.dev URL that never changes) deployed from the `staging`
# branch, so changes can be checked at a stable address before they
# ever reach nettapesh.ir. Set up on the Cloudflare dashboard side by
# creating a second "nettapesh-staging" Worker connected to this same
# GitHub repo with Production branch = staging (see worker/README.md).
# Wrangler environments do NOT inherit top-level bindings/settings
# automatically — every binding above needs to be repeated here or it
# silently wouldn't exist on the staging Worker. Learned the hard way:
# workers_dev = true up top did NOT carry over here either, leaving
# this Worker with no workers.dev URL enabled at all ("No URLs
# enabled" in the dashboard) until it was set again below.
[env.staging]
name = "netTSPPESHtest"
workers_dev = true

[env.staging.assets]
directory = "./frontend"

# Shares the SAME D1 database as production — deliberately: this is a
# personal side project, not a team setup with separate staging data to
# protect, and standing up a second database just to mirror schema.sql
# into it isn't worth the extra step for what staging is actually for
# here (checking that a change *works*, not testing against realistic
# data volume).
[[env.staging.d1_databases]]
binding = "DB"
database_name = "nettapesh"
database_id = "06d04b54-6f16-4819-9005-e60f6f1bfde6"

# Separate namespace_ids from production's (2001-2007 vs 1001-1007) —
# each binding is scoped to one Worker either way, but distinct IDs
# keep it obvious at a glance which set belongs to which Worker if
# they're ever viewed side by side in the dashboard.
[[env.staging.ratelimits]]
name = "RL_PING"
namespace_id = "2001"
[env.staging.ratelimits.simple]
limit = 180
period = 60

[[env.staging.ratelimits]]
name = "RL_CLIENT_INFO"
namespace_id = "2002"
[env.staging.ratelimits.simple]
limit = 20
period = 60

[[env.staging.ratelimits]]
name = "RL_DOWNLOAD"
namespace_id = "2003"
[env.staging.ratelimits.simple]
limit = 60
period = 60

[[env.staging.ratelimits]]
name = "RL_UPLOAD"
namespace_id = "2004"
[env.staging.ratelimits.simple]
limit = 180
period = 60

[[env.staging.ratelimits]]
name = "RL_RESULT"
namespace_id = "2005"
[env.staging.ratelimits.simple]
limit = 20
period = 60

[[env.staging.ratelimits]]
name = "RL_LATEST"
namespace_id = "2006"
[env.staging.ratelimits.simple]
limit = 60
period = 60

[[env.staging.ratelimits]]
name = "RL_HISTORY"
namespace_id = "2007"
[env.staging.ratelimits.simple]
limit = 60
period = 60

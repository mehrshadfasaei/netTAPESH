# Cloudflare Worker config (the current unified Workers+static-assets
# model, not the older separate "Pages" product) — serves frontend/ as
# static files and worker/index.js as the API. Requests matching a file
# under frontend/ are served directly without touching the Worker
# script at all; everything else (our /api/* routes, /health) reaches
# worker/index.js. See worker/README.md for the full deployment
# walkthrough (D1 database creation, applying schema.sql, filling in
# database_id below).
name = "nettapesh"
main = "worker/index.js"
compatibility_date = "2024-09-23"
# Gives an immediately-testable https://nettapesh.<subdomain>.workers.dev
# URL before a custom domain is wired up (see README's Cloudflare
# section) — turn off once nettapesh.ir is pointed here, if you'd
# rather only the real domain served it.
workers_dev = true

[assets]
directory = "./frontend"

[[d1_databases]]
binding = "DB"
database_name = "nettapesh"
database_id = "3cc0a09f-3b3b-421b-9f03-b96e82713f3e"

# One binding per endpoint (the native Rate Limiting API fixes a single
# limit/period per binding, not per call) — same per-route limits as
# backend/api/routes.py's @limiter.limit(...) decorators, sized to
# clear a normal test's request burst while still capping abuse. period
# is in seconds; the API only allows 10 or 60.
[[ratelimits]]
name = "RL_PING"
namespace_id = "1001"
[ratelimits.simple]
limit = 180
period = 60

[[ratelimits]]
name = "RL_CLIENT_INFO"
namespace_id = "1002"
[ratelimits.simple]
limit = 20
period = 60

[[ratelimits]]
name = "RL_DOWNLOAD"
namespace_id = "1003"
[ratelimits.simple]
limit = 60
period = 60

[[ratelimits]]
name = "RL_UPLOAD"
namespace_id = "1004"
[ratelimits.simple]
limit = 180
period = 60

[[ratelimits]]
name = "RL_RESULT"
namespace_id = "1005"
[ratelimits.simple]
limit = 20
period = 60

[[ratelimits]]
name = "RL_LATEST"
namespace_id = "1006"
[ratelimits.simple]
limit = 60
period = 60

[[ratelimits]]
name = "RL_HISTORY"
namespace_id = "1007"
[ratelimits.simple]
limit = 60
period = 60
